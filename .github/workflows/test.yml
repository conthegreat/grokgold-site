name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test runner
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps

      - name: Run Playwright
        run: npm test
