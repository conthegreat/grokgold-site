<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d27a"/>
      <stop offset="0.55" stop-color="#d4af37"/>
      <stop offset="1" stop-color="#a8832a"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1.2 L 8 5 L 0 8.8 z" fill="#d4af37"/>
    </marker>
  </defs>
  <rect width="1400" height="800" fill="#07090d"/>
  <text x="70" y="78" fill="#d4af37" font-family="Inter, Liberation Sans, sans-serif" font-size="16" font-weight="700" letter-spacing="3">ARCHITECTURE</text>
  <text x="70" y="128" fill="#eef1f6" font-family="Inter, Liberation Sans, sans-serif" font-size="36" font-weight="700">Four agents, one briefing</text>
  <g font-family="Inter, Liberation Sans, sans-serif">
    <rect x="70" y="200" width="360" height="120" rx="16" fill="#10151e" stroke="#d4af37" stroke-opacity="0.45"/>
    <text x="250" y="252" text-anchor="middle" fill="#eef1f6" font-size="24" font-weight="700">Calendar Watcher</text>
    <text x="250" y="286" text-anchor="middle" fill="#8b93a3" font-size="16">Dates and release times</text>
    <rect x="520" y="200" width="360" height="120" rx="16" fill="#10151e" stroke="#d4af37" stroke-opacity="0.45"/>
    <text x="700" y="252" text-anchor="middle" fill="#eef1f6" font-size="24" font-weight="700">Sentiment Scanner</text>
    <text x="700" y="286" text-anchor="middle" fill="#8b93a3" font-size="16">Headlines and tone</text>
    <rect x="970" y="200" width="360" height="120" rx="16" fill="#10151e" stroke="#d4af37" stroke-opacity="0.45"/>
    <text x="1150" y="252" text-anchor="middle" fill="#eef1f6" font-size="24" font-weight="700">Event Scanner</text>
    <text x="1150" y="286" text-anchor="middle" fill="#8b93a3" font-size="16">What is on the tape</text>
  </g>
  <path d="M250 320 V390 H700 V430" fill="none" stroke="#d4af37" stroke-opacity="0.7" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M700 320 V390" fill="none" stroke="#d4af37" stroke-opacity="0.7" stroke-width="2"/>
  <path d="M1150 320 V390 H700" fill="none" stroke="#d4af37" stroke-opacity="0.7" stroke-width="2"/>
  <rect x="470" y="440" width="460" height="120" rx="16" fill="#10151e" stroke="url(#gold)" stroke-width="1.5"/>
  <text x="700" y="492" text-anchor="middle" fill="#eef1f6" font-family="Inter, Liberation Sans, sans-serif" font-size="26" font-weight="700">Research Analyst</text>
  <text x="700" y="528" text-anchor="middle" fill="#8b93a3" font-family="Inter, Liberation Sans, sans-serif" font-size="16">Organises the three feeds into a briefing</text>
  <path d="M700 560 V620" fill="none" stroke="#d4af37" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="700" y="680" text-anchor="middle" fill="url(#gold)" font-family="Inter, Liberation Sans, sans-serif" font-size="26" font-weight="700">You read it. You decide.</text>
  <text x="1330" y="760" text-anchor="end" fill="#8b93a3" font-family="Inter, Liberation Sans, sans-serif" font-size="16" letter-spacing="2">PLACEHOLDER RENDER</text>
</svg>
